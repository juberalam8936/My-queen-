<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queen Zoya 👑</title>

<style>
body{
 margin:0;
 background:black;
 color:white;
 font-family:sans-serif;
 text-align:center;
 overflow:hidden;
}

.screen{
 height:100vh;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
}
.hide{display:none}

button{
 padding:15px 30px;
 font-size:20px;
 border:none;
 border-radius:30px;
 background:gold;
 animation:pulse 2s infinite;
}
@keyframes pulse{
 50%{transform:scale(1.1)}
}

/* zoom */
.zoom{animation:zoomIn 2s;}
@keyframes zoomIn{
 from{transform:scale(0.5);opacity:0}
 to{transform:scale(1);opacity:1}
}

/* image */
.img-box{position:relative;}
.img-box img{
 width:260px;
 border-radius:20px;
 box-shadow:0 0 30px gold;
}

/* crown */
.crown{
 position:absolute;
 top:-40px;
 left:50%;
 transform:translateX(-50%);
 width:100px;
 animation:float 2s infinite alternate;
}
@keyframes float{
 from{transform:translateX(-50%) translateY(0)}
 to{transform:translateX(-50%) translateY(-10px)}
}

/* hearts */
.heart{
 position:absolute;
 color:pink;
 animation:rise 6s linear infinite;
}
@keyframes rise{
 from{transform:translateY(0)}
 to{transform:translateY(-900px)}
}

/* confetti */
canvas{
 position:fixed;
 top:0;
 left:0;
 pointer-events:none;
}

.glow{
 color:gold;
 text-shadow:0 0 20px gold,0 0 40px pink;
}
</style>
</head>

<body>

<div id="start" class="screen">
<h1 class="glow">🎁 A Royal Surprise 👑</h1>
<button onclick="start()">Open Gift 💖</button>
</div>

<div id="scratch" class="screen hide">
<h2>Scratch to Unlock 🔥</h2>
<canvas id="c" width="300" height="300"></canvas>
</div>

<div id="final" class="screen hide zoom">

<h1 id="typing" class="glow"></h1>

<div class="img-box">
<img src="https://drive.google.com/uc?export=view&id=1CRBj9pGyTHbM6qS8yTtqE1epwo5nuxzg">
<img class="crown" src="https://cdn-icons-png.flaticon.com/512/616/616554.png">
</div>

<h2 class="glow">🎉 10K Royal Family 🎉</h2>

<p id="shayri"></p>

<div>
<img src="https://drive.google.com/uc?export=view&id=16hjQL9bmrnR1aMceOA7zcU_Jdg4PdR-Z" width="140">
<img src="https://drive.google.com/uc?export=view&id=1nHJPZvEyX8hMShFG_d6kQJBFC-LC-GPx" width="140">
<img src="https://drive.google.com/uc?export=view&id=1MfMx98quExSx-avzDrSa__pvn-clNJH1" width="140">
</div>

<h3>💝 Gifted by Juber 💝</h3>

</div>

<audio id="music" loop>
<source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3">
</audio>

<canvas id="confetti"></canvas>

<script>

function start(){
 document.getElementById("start").classList.add("hide");
 document.getElementById("scratch").classList.remove("hide");
 initScratch();
}

function initScratch(){
 let c=document.getElementById("c");
 let ctx=c.getContext("2d");
 ctx.fillStyle="#777";
 ctx.fillRect(0,0,300,300);

 let d=false;

 c.onmousedown=()=>d=true;
 c.onmouseup=()=>d=false;

 c.onmousemove=e=>{
  if(!d)return;
  ctx.globalCompositeOperation="destination-out";
  ctx.beginPath();
  ctx.arc(e.offsetX,e.offsetY,20,0,Math.PI*2);
  ctx.fill();
  check();
 };

 function check(){
  let p=ctx.getImageData(0,0,300,300).data;
  let count=0;
  for(let i=0;i<p.length;i+=4){
   if(p[i+3]==0)count++;
  }
  if(count>p.length/8){
   showFinal();
  }
 }
}

function showFinal(){
 document.getElementById("scratch").classList.add("hide");
 document.getElementById("final").classList.remove("hide");

 document.getElementById("music").play();

 hearts();
 confetti();
 typeText();
 shayri();
}

/* typing */
let text="👑 Congratulations Miss Zoya 👑";
let i=0;
function typeText(){
 if(i<text.length){
  document.getElementById("typing").innerHTML+=text.charAt(i);
  i++;
  setTimeout(typeText,70);
 }
}

/* shayri */
function shayri(){
 let arr=[
 "Teri muskaan meri duniya hai 💖",
 "10K nahi tera jaadu hai 👑",
 "Main sirf tera hoon ❤️"
 ];
 let i=0;
 setInterval(()=>{
  document.getElementById("shayri").innerHTML=arr[i];
  i=(i+1)%arr.length;
 },2000);
}

/* hearts */
function hearts(){
 for(let i=0;i<40;i++){
  let h=document.createElement("div");
  h.className="heart";
  h.innerHTML="💖";
  h.style.left=Math.random()*100+"%";
  document.body.appendChild(h);
 }
}

/* confetti */
function confetti(){
 let c=document.getElementById("confetti");
 let ctx=c.getContext("2d");
 c.width=window.innerWidth;
 c.height=window.innerHeight;
 for(let i=0;i<200;i++){
  ctx.fillRect(Math.random()*c.width,Math.random()*c.height,5,5);
 }
}

</script>

</body>
</html>
